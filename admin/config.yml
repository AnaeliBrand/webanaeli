backend:
  name: github
  repo: AnaeliBrand/webanaeli
  branch: main

media_folder: "assets/uploads"
public_folder: "assets/uploads"

locale: "es"

collections:
  - name: "paquetes"
    label: "Paquetes de servicios"
    files:
      - name: "branding"
        label: "Paquetes de Branding"
        file: "data/packages.json"
        fields:
          - label: "Paquetes de Branding"
            name: "paquetes_branding"
            widget: "list"
            fields:
              - { label: "Nombre", name: "nombre", widget: "string" }
              - { label: "Etiqueta chiquita (ej. Recomendado)", name: "etiqueta", widget: "string", required: false }
              - { label: "Tagline (cursiva)", name: "tagline", widget: "string" }
              - { label: "Para quién es (descripción)", name: "para_quien", widget: "text" }
              - { label: "Tiempo de entrega", name: "entrega", widget: "string" }
              - label: "Qué incluye (una línea por ítem)"
                name: "incluye"
                widget: "list"
                field: { label: "Ítem", name: "item", widget: "string" }
              - { label: "Cantidad de piezas (texto final)", name: "piezas", widget: "string", required: false }
              - label: "Color de fondo"
                name: "color_fondo"
                widget: "select"
                options: ["lavender", "olive", "yellow", "dark"]
          - label: "Paquetes de Naming"
            name: "paquetes_naming"
            widget: "list"
            fields:
              - { label: "Nombre", name: "nombre", widget: "string" }
              - { label: "Tagline (cursiva)", name: "tagline", widget: "string" }
              - { label: "Para quién es (descripción)", name: "para_quien", widget: "text" }
              - { label: "Tiempo de entrega", name: "entrega", widget: "string" }
              - label: "Qué incluye (una línea por ítem)"
                name: "incluye"
                widget: "list"
                field: { label: "Ítem", name: "item", widget: "string" }
              - { label: "Cantidad de piezas (texto final)", name: "piezas", widget: "string", required: false }
              - label: "Color de fondo"
                name: "color_fondo"
                widget: "select"
                options: ["lavender", "olive", "yellow", "dark"]

  - name: "portafolio"
    label: "Portafolio (marcas)"
    files:
      - name: "marcas"
        label: "Marcas del portafolio"
        file: "data/portfolio.json"
        fields:
          - label: "Marcas"
            name: "marcas"
            widget: "list"
            fields:
              - { label: "Nombre de la marca", name: "nombre", widget: "string" }
              - { label: "Eslogan corto (genérico, sin revelar de qué es la marca)", name: "eslogan", widget: "text" }
              - { label: "Palabra decorativa de fondo (ej. IDENTIDAD, ESTILO)", name: "palabra_fondo", widget: "string" }
              - { label: "Foto de portada", name: "portada", widget: "image" }
              - label: "Todas las fotos del álbum (en orden)"
                name: "fotos"
                widget: "list"
                field: { label: "Foto", name: "foto", widget: "image" }

  - name: "textos"
    label: "Textos generales del sitio"
    files:
      - name: "general"
        label: "Textos del Home"
        file: "data/site-texts.json"
        fields:
          - { label: "Palabras que rotan en el hero (una por línea)", name: "hero_palabras", widget: "list", field: { label: "Palabra", name: "palabra", widget: "string" } }
          - { label: "Subtítulo del hero", name: "hero_subtitulo", widget: "text" }
          - { label: "Declaración de marca (franja destacada)", name: "declaracion", widget: "text" }
          - { label: "Texto del estudio (párrafo 1)", name: "estudio_p1", widget: "text" }
          - { label: "Texto de la misión", name: "estudio_mision", widget: "text" }
